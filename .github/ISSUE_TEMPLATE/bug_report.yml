name: Bug report
description: Report a problem so we can fix it
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please provide a **minimal reproducer** and your
        environment so we can investigate quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducer
      description: The smallest code snippet that reproduces the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      description: Paste the full traceback, if any.
      render: shell
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        Output of:
        `python -c "import sys,torch,gpytorch,deepgp;print(sys.version);print('torch',torch.__version__);print('gpytorch',gpytorch.__version__);print('deepgp',deepgp.__version__)"`
      render: shell
    validations:
      required: true
