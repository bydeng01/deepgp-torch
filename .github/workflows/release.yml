name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check the tag matches deepgp.__version__
        if: github.event_name == 'release'
        run: |
          version=$(grep -oE '"[^"]+"' src/deepgp/version.py | tail -1 | tr -d '"')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Validate metadata
        run: twine check --strict dist/*

      - name: Check the wheel ships its package data
        run: |
          python - <<'PY'
          import glob, zipfile
          (whl,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(whl).namelist()
          for required in ("deepgp/data/snelson1d.npz", "deepgp/py.typed"):
              assert required in names, f"missing from wheel: {required}"
          print("wheel contents OK:", whl)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepgp-torch
    permissions:
      id-token: write   # mint the OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
